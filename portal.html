        <span class="pep-foot__link-label">${t().viewOnline}</span>
        <a class="pep-foot__link-url" href="${esc(url)}">${esc(url.replace(/^https?:\/\//, ''))}</a>
        <span class="pep-foot__link-scan">${t().scanShare}</span>
      </div>
    </div>
    <div class="pep-foot__brand">
      <span class="pep-foot__powered">${t().poweredBy}</span>
      <span class="pep-foot__platform">${t().platform}</span>
    </div>
    <p class="pep-foot__note">${t().footerNote}</p>
  </div></footer>`;
    }
    function renderExpired(e) {
      const notFound = e && e.status === 404;
      document.title = 'Evidence Portal · PubliAudit';
      document.getElementById('app').innerHTML = `<div class="pep">
    <div class="pep__signal"></div>
    <div class="pep-expired"><div class="pep-expired__card">
      <span class="pep-expired__ico">${icon('off', 24)}</span>
      <div class="pep-expired__title">${notFound ? t().notFoundTitle : t().expiredTitle}</div>
      <p class="pep-expired__body">${notFound ? t().notFoundBody : t().expiredBody}</p>
    </div></div>
  </div>`;
    }

    /* ── Orchestration ────────────────────────────────────────────── */
    function renderDetail() {
      const m = S.config.metrics;
      const parts = [];
      const showMedium = m.includes('by_medium'), showDaypart = m.includes('by_daypart');
      if (showMedium || showDaypart) {
        const left = showMedium ? buildByMedium() : '';
        const right = showDaypart ? buildDayparts() : '';
        if (left || right) parts.push(`<div class="pep-duo">${left ? `<section>${left}</section>` : ''}${right ? `<section>${right}</section>` : ''}</div>`);
      }
      if (m.includes('by_source')) { const h = buildBySource(); if (h) parts.push(h); }
      if (!S.printMode && (m.includes('timeline') || m.includes('detections_detail'))) {
        parts.push(buildRefine());
        const pills = buildPills();
        if (pills) parts.push(pills);
      }
      if (m.includes('timeline')) parts.push(buildTimeline());
      if (m.includes('by_ad')) { const h = buildBreakdown('ad_name', t().byAd); if (h) parts.push(h); }
      if (m.includes('by_campaign')) { const h = buildBreakdown('campaign_name', t().byCampaign); if (h) parts.push(h); }
      if (m.includes('detections_detail')) parts.push(buildLibrary());
      return parts.join('');
    }
    function rerenderDetail() {
      const root = document.getElementById('detail-root');
      if (!root) return;
      const active = document.activeElement;
      const wasSearchFocused = active && active.id === 'lib-search';
      const selStart = wasSearchFocused ? active.selectionStart : null;
      root.innerHTML = renderDetail();
      if (wasSearchFocused) {
        const el = document.getElementById('lib-search');
        if (el) { el.focus(); if (selStart != null) el.setSelectionRange(selStart, selStart); }
      }
    }
    function renderAll() {
      const m = S.config.metrics;
      const detailReady = S.detsLoaded || !needsDetail(m);
      document.getElementById('app').innerHTML = `<div class="pep">
    <div class="pep__signal"></div>
    ${buildUtilBar()}
    <main class="pep-main">
      ${buildHeader()}
      ${buildKPIs()}
      <div id="detail-root">${detailReady ? renderDetail() : `<div class="loading"><div class="spinner"></div></div>`}</div>
    </main>
    ${buildFooter()}
    <div id="viewer-root"></div>
  </div>`;
      if (S.open) renderViewer();
    }

    /* ── Event handlers ──────────────────────────────────────────── */
    function setLang(l) { S.lang = l; localStorage.setItem('pa-lang', l); renderAll(); }
    function toggleTheme() {
      const h = document.documentElement;
      h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('pa-theme', h.dataset.theme);
    }
    function setPill(kind, val) {
      val = dec(val);
      S.pillFilters[kind] = S.pillFilters[kind] === val ? '' : val;
      rerenderDetail();
    }
    function clearPills() { S.pillFilters = { ad: '', media: '' }; rerenderDetail(); }
    function onSearch(v) { S.query = v; rerenderDetail(); }
    function toggleGroup(id) {
      const dets = filteredDets();
      const manyTotal = dets.length > 30;
      const itemCount = dets.filter(d => d.stream_id === id).length;
      const current = groupIsCollapsed(id, itemCount, manyTotal);
      S.collapsed[id] = !current;
      rerenderDetail();
    }
    function showMore(id) { S.shown[id] = (S.shown[id] || PAGE) + PAGE; rerenderDetail(); }
    function toggleAllGroups(currentlyAllExpanded) {
      const ids = Array.from(new Set(filteredDets().map(d => d.stream_id)));
      const next = {};
      ids.forEach(id => { next[id] = currentlyAllExpanded; });
      S.collapsed = next;
      rerenderDetail();
    }
    async function setServerFilter(key, val) { S.serverFilters[key] = val; await reloadDetail(); }
    async function resetServerFilters() { S.serverFilters = { stream: '', campaign: '', from: '', to: '' }; await reloadDetail(); }
    async function reloadDetail() {
      S.pillFilters = { ad: '', media: '' }; S.query = ''; S.collapsed = {}; S.shown = {};
      const root = document.getElementById('detail-root');
      if (root) root.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
      await bulkFetchDetections();
      rerenderDetail();
    }
    async function downloadPdf() {
      const btn = document.getElementById('pdf-btn');
      const { stream, campaign, from, to } = S.serverFilters;
      const params = new URLSearchParams({ lang: S.lang });
      if (stream)   params.set('stream_id', stream);
      if (campaign) params.set('campaign_id', campaign);
      if (from)     params.set('date_from', from);
      if (to)       params.set('date_to', to);

      const prevHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = t().generatingPdf;
      try {
        const res = await fetch(`${BASE}/report.pdf?${params}`);
        if (!res.ok) throw new Error('PDF generation failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${(S.report && S.report.ref) || 'reporte'}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert(S.lang === 'es' ? 'No se pudo generar el PDF. Intenta de nuevo.' : 'Could not generate the PDF. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = prevHtml;
      }
    }

    /* ── Init ─────────────────────────────────────────────────────── */
    async function init() {
      const savedTheme = localStorage.getItem('pa-theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      document.documentElement.lang = S.lang;

      try {
        const meta = await api(BASE);
        S.report = meta.report; S.config = meta.config; S.summary = meta.summary; S.filtersMeta = meta.filters;
        document.title = `${S.report.client_name || 'Evidence Portal'} — PubliAudit`;

        renderAll();

        if (needsDetail(S.config.metrics)) {
          await bulkFetchDetections();
          rerenderDetail();
        }

        const evId = new URLSearchParams(location.search).get('evidence');
        if (evId) openViewer(evId);
      } catch (e) {
        renderExpired(e);
      }
    }
    init();
  </script>
</body>
