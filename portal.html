<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Evidence Portal · PubliAudit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --cyan-50: #ECFAFF;
      --cyan-200: #ABE7FD;
      --cyan-400: #3FCBFB;
      --cyan-500: #1CC0F9;
      --cyan-600: #06A6E0;
      --cyan-700: #0A85B6;
      --neutral-0: #FFFFFF;
      --neutral-50: #F6F8FA;
      --neutral-100: #EFF2F5;
      --neutral-150: #E7EBF0;
      --neutral-200: #DCE2E8;
      --neutral-300: #C5CCD5;
      --neutral-400: #9AA3AE;
      --neutral-500: #6B7480;
      --neutral-600: #4D555F;
      --neutral-700: #3A3F47;
      --neutral-800: #24272D;
      --neutral-900: #15181C;
      --green-50: #ECFDF3;
      --green-500: #16A34A;
      --green-700: #166534;
      --amber-50: #FFF8EB;
      --amber-500: #F59E0B;
      --amber-700: #B45309;
      --red-50: #FEF1F2;
      --red-500: #E5484D;
      --red-700: #B0242A;
      --font-display: "Montserrat", "Hanken Grotesk", system-ui, sans-serif;
      --font-sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;

      /* media-type categorical palette (fixed, matches PubliAudit DS) */
      --media-radio: #1CC0F9;
      --media-tv: #7C5CFC;
      --media-streaming: #10B981;
      --media-podcast: #F59E0B;
      --media-news: #F43F5E;
      --media-social: #6366F1;

      /* radii */
      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-pill: 999px;

      /* type scale + weights */
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --text-2xs: 11px;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-md: 14px;
      --text-lg: 17px;
      --text-xl: 20px;
      --text-2xl: 24px;
      --tracking-caps: .08em;

      /* motion */
      --dur-fast: 140ms;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);
    }

    [data-theme="dark"] {
      --bg-app: #0B0D10;
      --bg-canvas: #0F1216;
      --surface-1: #14181D;
      --surface-2: #181D23;
      --surface-3: #1E242B;
      --surface-hover: #1B2127;
      --text-strong: #F4F7FA;
      --text-primary: #E4E9EF;
      --text-secondary: #A8B2BD;
      --text-tertiary: #7C8794;
      --text-disabled: #535C66;
      --border-subtle: #20262D;
      --border-default: #2A323A;
      --border-strong: #3A444E;
      --accent: var(--cyan-500);
      --accent-hover: var(--cyan-400);
      --accent-soft: rgba(28, 192, 249, .12);
      --accent-soft-border: rgba(28, 192, 249, .3);
      --accent-text: var(--cyan-400);
      --success-bg: rgba(22, 163, 74, .14);
      --success-fg: #5BD98A;
      --warning-bg: rgba(245, 158, 11, .14);
      --warning-fg: #FBC56A;
      --danger-bg: rgba(229, 72, 77, .16);
      --danger-fg: #FF8589;
      --primary-bg: var(--neutral-0);
      --primary-fg: var(--neutral-900);
      --overlay-scrim: rgba(0, 0, 0, .6);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .35);
      --shadow-md: 0 2px 6px rgba(0, 0, 0, .45), 0 6px 16px rgba(0, 0, 0, .5);
      --shadow-lg: 0 6px 16px rgba(0, 0, 0, .5), 0 16px 36px rgba(0, 0, 0, .6);
      --shadow-xl: 0 12px 28px rgba(0, 0, 0, .55), 0 28px 60px rgba(0, 0, 0, .7);
    }

    [data-theme="light"] {
      --bg-app: var(--neutral-50);
      --bg-canvas: var(--neutral-100);
      --surface-1: var(--neutral-0);
      --surface-2: var(--neutral-50);
      --surface-3: var(--neutral-100);
      --surface-hover: var(--neutral-50);
      --text-strong: var(--neutral-900);
      --text-primary: var(--neutral-800);
      --text-secondary: var(--neutral-600);
      --text-tertiary: var(--neutral-500);
      --text-disabled: var(--neutral-400);
      --border-subtle: var(--neutral-150);
      --border-default: var(--neutral-200);
      --border-strong: var(--neutral-300);
      --accent: var(--cyan-500);
      --accent-hover: var(--cyan-600);
      --accent-soft: #ECFAFF;
      --accent-soft-border: var(--cyan-200);
      --accent-text: var(--cyan-700);
      --success-bg: var(--green-50);
      --success-fg: var(--green-700);
      --warning-bg: var(--amber-50);
      --warning-fg: var(--amber-700);
      --danger-bg: var(--red-50);
      --danger-fg: var(--red-700);
      --primary-bg: var(--neutral-900);
      --primary-fg: var(--neutral-0);
      --overlay-scrim: rgba(15, 18, 22, .45);
      --shadow-sm: 0 1px 2px rgba(16, 24, 33, .06), 0 1px 3px rgba(16, 24, 33, .04);
      --shadow-md: 0 2px 4px rgba(16, 24, 33, .05), 0 4px 12px rgba(16, 24, 33, .07);
      --shadow-lg: 0 4px 8px rgba(16, 24, 33, .06), 0 12px 28px rgba(16, 24, 33, .10);
      --shadow-xl: 0 8px 16px rgba(16, 24, 33, .08), 0 24px 48px rgba(16, 24, 33, .14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-app);
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: var(--font-display);
      color: var(--text-strong);
      font-weight: 700;
      line-height: 1.18
    }

    p {
      margin: 0
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit
    }

    select,
    input {
      font-family: inherit
    }

    a {
      color: var(--accent-text)
    }

    svg {
      display: block
    }

    .pep {
      min-height: 100vh;
      background: var(--bg-app);
      color: var(--text-primary);
      display: flex;
      flex-direction: column
    }

    .pep__signal {
      height: 3px;
      background: var(--accent);
      width: 100%
    }

    /* ── Utility bar ── */
    .pep-util {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 24px
    }

    .pep-util__verified {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary)
    }

    .pep-util__verified svg {
      color: var(--accent)
    }

    .pep-util__spacer {
      flex: 1
    }

    .pep-util__controls {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .pep-lang {
      display: flex;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      overflow: hidden
    }

    .pep-lang button {
      padding: 5px 10px;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary);
      transition: var(--dur-fast)
    }

    .pep-lang button.is-on {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .pep-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      transition: var(--dur-fast);
      white-space: nowrap
    }

    .pep-btn--secondary {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      color: var(--text-secondary)
    }

    .pep-btn--secondary:hover {
      background: var(--surface-hover);
      color: var(--text-primary)
    }

    .pep-iconbtn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-default);
      background: var(--surface-1);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--dur-fast);
      flex-shrink: 0
    }

    .pep-iconbtn:hover {
      background: var(--surface-hover);
      color: var(--text-primary)
    }

    /* ── Shell ── */
    .pep-main {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      padding: 8px 24px 64px;
      display: flex;
      flex-direction: column;
      gap: 32px
    }

    /* ── Header ── */
    .pep-head {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    .pep-head__top {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap
    }

    .pep-head__logo {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: var(--radius-lg);
      background: var(--text-strong);
      color: var(--surface-1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: var(--fw-bold);
      font-size: 22px;
      letter-spacing: -.02em;
      overflow: hidden
    }

    .pep-head__logo img {
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .pep-head__id {
      flex: 1;
      min-width: 180px
    }

    .pep-head__eyebrow {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px
    }

    .pep-head__client {
      font-family: var(--font-display);
      font-weight: var(--fw-bold);
      font-size: var(--text-2xl);
      letter-spacing: -.02em;
      color: var(--text-strong);
      line-height: 1.1
    }

    .pep-head__issuer {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: 4px
    }

    .pep-head__issuer strong {
      color: var(--text-primary);
      font-weight: var(--fw-semibold)
    }

    .pep-head__verified {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      align-self: flex-start;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: var(--success-bg);
      color: var(--success-fg);
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      border: 1px solid color-mix(in srgb, var(--success-fg) 26%, transparent)
    }

    .pep-head__campaign {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle)
    }

    .pep-head__campaign-label {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary)
    }

    .pep-head__campaign-name {
      font-family: var(--font-display);
      font-weight: var(--fw-semibold);
      font-size: var(--text-xl);
      color: var(--text-strong);
      letter-spacing: -.01em
    }

    .pep-head__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 8px
    }

    .pep-head__meta-item {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .pep-head__meta-k {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap
    }

    .pep-head__meta-v {
      font-size: var(--text-sm);
      font-weight: var(--fw-medium);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums
    }

    /* ── Section scaffolding ── */
    .pep-section {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .pep-section__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap
    }

    .pep-section__title {
      font-family: var(--font-display);
      font-weight: var(--fw-semibold);
      font-size: var(--text-lg);
      color: var(--text-strong);
      letter-spacing: -.01em
    }

    .pep-section__sub {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      margin-top: 2px
    }

    .pep-section__count {
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    /* ── KPI grid ── */
    .pep-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px
    }

    .pep-kpi {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      transition: border-color .15s
    }

    .pep-kpi:hover {
      border-color: var(--border-default)
    }

    .pep-kpi__label {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      color: var(--text-tertiary);
      margin-bottom: 6px
    }

    .pep-kpi__val {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      color: var(--text-strong);
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .pep-kpi__sub {
      font-size: var(--text-2xs);
      color: var(--text-disabled);
      margin-top: 4px
    }

    .pep-kpi__flag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--warning-bg);
      color: var(--warning-fg);
      font-size: var(--text-2xs);
      font-weight: var(--fw-semibold)
    }

    /* ── By-medium donut ── */
    .pep-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: stretch
    }

    .pep-duo>section {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 20px 22px
    }

    @media (max-width:720px) {
      .pep-duo {
        grid-template-columns: 1fr
      }
    }

    .pep-bymedium {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap
    }

    .pep-bymedium__donut {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .pep-bymedium__hole {
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: var(--surface-1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .pep-bymedium__hole span {
      font-family: var(--font-display);
      font-weight: var(--fw-bold);
      font-size: var(--text-xl);
      color: var(--text-strong);
      letter-spacing: -.02em
    }

    .pep-bymedium__hole small {
      font-size: var(--text-2xs);
      color: var(--text-tertiary)
    }

    .pep-bymedium__legend {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
      min-width: 140px
    }

    .pep-bymedium__leg {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .pep-bymedium__dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0
    }

    .pep-bymedium__name {
      flex: 1;
      font-size: var(--text-sm);
      color: var(--text-secondary)
    }

    .pep-bymedium__val {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--text-strong);
      font-variant-numeric: tabular-nums
    }

    /* ── Breakdown bars (dayparts / source / ad / campaign) ── */
    .pep-breakdown {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .pep-breakdown__row {
      display: grid;
      grid-template-columns: minmax(110px, .9fr) 1.6fr auto;
      gap: 14px;
      align-items: center
    }

    .pep-breakdown__name {
      font-size: var(--text-sm);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pep-breakdown__track {
      height: 9px;
      background: var(--surface-2);
      border-radius: var(--radius-pill);
      overflow: hidden
    }

    .pep-breakdown__bar {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill)
    }

    .pep-breakdown__val {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--text-strong);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    @media (max-width:560px) {
      .pep-breakdown__row {
        grid-template-columns: 1fr auto
      }

      .pep-breakdown__track {
        display: none
      }
    }

    .pep-standalone {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 20px 22px
    }

    /* ── Filter bar ── */
    .pep-refine {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 16px
    }

    .pep-refine__row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end
    }

    .pep-fg {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 140px
    }

    .pep-fg label {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-tertiary)
    }

    .pep-fc {
      height: 34px;
      padding: 0 10px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: 7px;
      color: var(--text-primary);
      font-size: var(--text-sm);
      outline: none;
      width: 100%;
      transition: border-color .15s
    }

    .pep-fc:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft)
    }

    .pep-btn-reset {
      height: 34px;
      padding: 0 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: 7px;
      color: var(--text-secondary);
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      white-space: nowrap;
      align-self: flex-end;
      flex-shrink: 0;
      transition: .15s
    }

    .pep-btn-reset:hover {
      background: var(--surface-hover);
      color: var(--text-primary)
    }

    .pep-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .pep-filters__label {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
      margin-right: 2px
    }

    .pep-filters__sep {
      width: 1px;
      height: 14px;
      background: var(--border-default);
      margin: 0 2px;
      flex-shrink: 0
    }

    .pep-filters__pill {
      border: 1px solid var(--border-default);
      background: transparent;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary);
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      transition: .12s;
      white-space: nowrap
    }

    .pep-filters__pill:hover {
      background: var(--surface-hover)
    }

    .pep-filters__pill.is-on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text)
    }

    /* ── Scatter timeline chart ── */
    .pep-scatter-wrap {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px 14px;
      display: flex;
      flex-direction: column
    }

    .pep-scatter__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .pep-scatter__legend {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap
    }

    .pep-scatter__leg {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary)
    }

    .pep-scatter__legdot {
      width: 9px;
      height: 9px;
      border-radius: 3px
    }

    .pep-scatter__stats {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap
    }

    .pep-scatter__stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: right
    }

    .pep-scatter__stat-k {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap
    }

    .pep-scatter__stat-v {
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--text-strong);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .pep-scatter__scroll {
      overflow-x: auto
    }

    .pep-scatter__row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      min-width: 560px
    }

    .pep-scatter__row--header,
    .pep-scatter__row--footer {
      border-top: none
    }

    .pep-scatter__row--dim {
      opacity: .3
    }

    .pep-scatter__src-col {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px 7px 0;
      min-width: 0
    }

    .pep-scatter__src-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .pep-scatter__src-name {
      font-size: 11px;
      font-weight: var(--fw-medium);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pep-scatter__track {
      position: relative;
      display: grid;
      align-items: center;
      height: 32px
    }

    .pep-scatter__track--header {
      height: 20px
    }

    .pep-scatter__track--footer {
      height: 16px
    }

    .pep-scatter__line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--border-default);
      z-index: 0
    }

    .pep-scatter__cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      z-index: 1
    }

    .pep-scatter__day-lbl {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary)
    }

    .pep-scatter__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      position: relative
    }

    .pep-scatter__badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      font-size: 8px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1
    }

    /* ── Evidence library ── */
    .pep-rsearch {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      height: 38px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      color: var(--text-tertiary)
    }

    .pep-rsearch input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      min-width: 0;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      color: var(--text-primary)
    }

    .pep-rsearch input::placeholder {
      color: var(--text-tertiary)
    }

    .pep-rsearch button {
      display: inline-flex;
      color: var(--text-tertiary);
      padding: 2px
    }

    .pep-empty {
      padding: 44px 20px;
      text-align: center;
      color: var(--text-tertiary);
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl)
    }

    .pep-lib-tools {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .pep-lib-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border-default);
      background: var(--surface-1);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      padding: 5px 10px;
      white-space: nowrap;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold)
    }

    .pep-lib-toggle:hover {
      background: var(--surface-hover);
      color: var(--text-primary)
    }

    .pep-glist {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden
    }

    .pep-group+.pep-group .pep-group__head {
      border-top: 1px solid var(--border-default)
    }

    .pep-group__head {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 16px;
      background: var(--surface-2);
      text-align: left
    }

    .pep-group__head:hover {
      background: var(--surface-hover)
    }

    .pep-group__ico {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-1);
      color: var(--text-secondary)
    }

    .pep-group__name {
      font-size: var(--text-sm);
      font-weight: var(--fw-bold);
      color: var(--text-strong);
      white-space: nowrap
    }

    .pep-group__city {
      font-size: var(--text-2xs);
      color: var(--text-tertiary);
      white-space: nowrap
    }

    .pep-group__count {
      margin-left: auto;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .pep-group__chev {
      color: var(--text-tertiary);
      transition: transform var(--dur-fast) var(--ease-standard);
      flex-shrink: 0
    }

    .pep-group.is-collapsed .pep-group__chev {
      transform: rotate(-90deg)
    }

    .pep-grow {
      display: grid;
      grid-template-columns: minmax(0, 2.6fr) .9fr .7fr .8fr 34px;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 9px 18px;
      border-top: 1px solid var(--border-subtle);
      font-family: var(--font-sans)
    }

    .pep-grow:hover {
      background: var(--surface-hover)
    }

    .pep-grow:hover .pep-list__go {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .pep-list__ad {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px
    }

    .pep-list__ad-name {
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--text-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pep-list__ad-id {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--text-tertiary);
      flex-shrink: 0
    }

    .pep-list__cell {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .pep-list__cell--mono {
      font-family: var(--font-mono)
    }

    .pep-list__flag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--warning-fg);
      background: var(--warning-bg);
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      justify-self: start
    }

    .pep-list__go {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-md);
      color: var(--text-tertiary);
      transition: var(--dur-fast)
    }

    .pep-gmore {
      width: 100%;
      padding: 11px;
      border-top: 1px solid var(--border-subtle);
      color: var(--accent-text);
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold)
    }

    .pep-gmore:hover {
      background: var(--surface-hover)
    }

    .pep-gsubtotal {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 9px 20px;
      border-top: 1px solid var(--border-default);
      background: var(--surface-2);
      font-size: var(--text-xs);
      color: var(--text-secondary)
    }

    .pep-gsubtotal strong {
      color: var(--text-strong);
      font-weight: var(--fw-semibold);
      font-variant-numeric: tabular-nums
    }

    .pep-print-only {
      display: none
    }

    @media (max-width:720px) {
      .pep-grow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        padding: 13px 46px 13px 16px;
        position: relative
      }

      .pep-grow .pep-list__ad {
        flex: 1 1 100%
      }

      .pep-grow .pep-list__go {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%)
      }

      .pep-kpis {
        grid-template-columns: 1fr 1fr
      }

      .pep-head {
        padding: 22px 20px
      }
    }

    /* ── Evidence Viewer ── */
    .pep-viewer-scrim {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--overlay-scrim);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: pep-fade var(--dur-fast) var(--ease-standard)
    }

    @keyframes pep-fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes pep-rise {
      from {
        transform: translateY(16px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .pep-viewer {
      width: 100%;
      max-width: 520px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: pep-rise 200ms var(--ease-standard);
      max-height: calc(100vh - 48px)
    }

    .pep-viewer__head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle)
    }

    .pep-viewer__head-ico {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .pep-viewer__head-t {
      flex: 1;
      min-width: 0
    }

    .pep-viewer__head-kind {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary)
    }

    .pep-viewer__head-ad {
      font-family: var(--font-display);
      font-weight: var(--fw-semibold);
      font-size: var(--text-md);
      color: var(--text-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pep-viewer__body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .pep-stage {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      background: var(--surface-2);
      overflow: hidden
    }

    .pep-stage--video video {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      background: #000
    }

    .pep-stage--audio {
      padding: 16px 16px 12px
    }

    .pep-wave {
      width: 100%;
      height: 72px;
      display: block;
      cursor: pointer;
      touch-action: none
    }

    .pep-transport {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 12px
    }

    .pep-transport__play {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--primary-bg);
      color: var(--primary-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--dur-fast)
    }

    .pep-transport__play:hover {
      filter: brightness(1.08)
    }

    .pep-transport__time {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .pep-transport__type {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-tertiary)
    }

    .pep-vmeta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .pep-vmeta__cell {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .pep-vmeta__k {
      font-size: var(--text-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--text-tertiary)
    }

    .pep-vmeta__v {
      font-size: var(--text-sm);
      color: var(--text-primary);
      font-variant-numeric: tabular-nums
    }

    .pep-viewer__foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-2)
    }

    .pep-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--success-bg);
      color: var(--success-fg);
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold)
    }

    @media (max-width:720px) {
      .pep-viewer-scrim {
        align-items: flex-end;
        padding: 0
      }

      .pep-viewer {
        max-width: 100%;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        max-height: 92vh;
        animation: pep-sheet 220ms var(--ease-standard)
      }

      @keyframes pep-sheet {
        from {
          transform: translateY(100%)
        }

        to {
          transform: translateY(0)
        }
      }
    }

    @media (max-width:420px) {
      .pep-vmeta {
        grid-template-columns: 1fr 1fr
      }
    }

    /* ── Footer ── */
    .pep-foot {
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-1)
    }

    .pep-foot__inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap
    }

    .pep-foot__share {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 240px
    }

    .pep-foot__qr {
      width: 88px;
      height: 88px;
      padding: 6px;
      border-radius: var(--radius-md);
      background: #fff;
      border: 1px solid var(--border-default);
      flex-shrink: 0;
      display: block
    }

    .pep-foot__link {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0
    }

    .pep-foot__link-label {
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary)
    }

    .pep-foot__link-url {
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--accent-text);
      text-decoration: none;
      word-break: break-all
    }

    .pep-foot__link-url:hover {
      text-decoration: underline
    }

    .pep-foot__link-scan {
      font-size: var(--text-2xs);
      color: var(--text-tertiary)
    }

    .pep-foot__brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 200px
    }

    .pep-foot__powered {
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary)
    }

    .pep-foot__platform {
      font-size: var(--text-xs);
      color: var(--text-tertiary)
    }

    .pep-foot__note {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      max-width: 280px
    }

    /* ── Expired / error state ── */
    .pep-expired {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px
    }

    .pep-expired__card {
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 40px 34px
    }

    .pep-expired__ico {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-3);
      color: var(--text-tertiary)
    }

    .pep-expired__title {
      font-family: var(--font-display);
      font-weight: var(--fw-semibold);
      font-size: var(--text-xl);
      color: var(--text-strong);
      letter-spacing: -.01em
    }

    .pep-expired__body {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 96px 0;
      color: var(--text-tertiary)
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-default);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ── Print → clean PDF ── */
    @media print {

      .pep-util,
      .pep__signal,
      .pep-rsearch,
      .pep-refine,
      .pep-filters,
      .pep-group__chev,
      .pep-list__go,
      .pep-gmore,
      .pep-lib-tools {
        display: none !important
      }

      .pep {
        background: #fff
      }

      .pep-main {
        padding: 0 !important;
        max-width: 100% !important;
        gap: 16px !important
      }

      .pep-section,
      .pep-glist,
      .pep-head,
      .pep-duo>section,
      .pep-scatter-wrap,
      .pep-standalone {
        box-shadow: none !important
      }

      .pep-group,
      .pep-grow,
      .pep-section__head {
        break-inside: avoid
      }

      .pep-foot__qr {
        display: block !important
      }

      .pep-print-only {
        display: inline !important
      }

      @page {
        margin: 14mm
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>&nbsp;Cargando portal…
    </div>
  </div>

  <script>
    /* ============================================================
       PubliAudit — Public Evidence Portal (vanilla JS, no build step)
       Reads real data from /api/public/{token}*. Bilingual EN/ES,
       light/dark, sections gated by config.metrics (REPORT_METRICS
       in main.py). See design/PubliAudit Design System report/ spec.
       ============================================================ */
    const TOKEN = '__TOKEN__';
    const BASE = '/api/public/' + TOKEN;
    const HN_TZ = 'America/Tegucigalpa';

    /* ── i18n ─────────────────────────────────────────────────── */
    const STR = {
      es: {
        verified: 'Verificado por PubliAudit', kind: 'Reporte público de evidencia',
        issuedBy: 'Emitido por', reportFor: 'Reporte para', campaign: 'Campaña', client: 'Cliente',
        period: 'Período del reporte', generated: 'Reporte generado', evidenceId: 'Folio', expires: 'Expira',
        summaryTitle: 'Resumen de campaña',

    const MONTHS = {
      es: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'],
      en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
    };
    const WEEKDAYS = { es: ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
    const MEDIA_LABEL = {
      es: { radio: 'Radio', tv: 'TV', streaming: 'Streaming', podcast: 'Podcast', news: 'Noticias', social: 'Redes' },
      en: { radio: 'Radio', tv: 'TV', streaming: 'Streaming', podcast: 'Podcast', news: 'News', social: 'Social' }

    };

    /* ── State ────────────────────────────────────────────────── */
    const S = {
      lang: localStorage.getItem('pa-lang') || 'es',
      report: null, config: null, summary: null, filtersMeta: null,
      allDets: [], detsLoaded: false, detsCapped: false,
      serverFilters: { stream: '', campaign: '', from: '', to: '' },
      pillFilters: { ad: '', media: '' },
      query: '',
      collapsed: {}, shown: {},
      open: null, printMode: false,
    };
    function t() { return STR[S.lang]; }

    /* ── Formatting helpers ──────────────────────────────────── */
    function esc(s) { if (s == null) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function fmtN(n) { return (n || 0).toLocaleString(S.lang === 'es' ? 'es' : 'en'); }
    function pad(n) { return String(n).padStart(2, '0'); }

    const _hnFmt = new Intl.DateTimeFormat('en-CA', { timeZone: HN_TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    function hnParts(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d)) return null;
      const p = {}; _hnFmt.formatToParts(d).forEach(x => { p[x.type] = x.value; });
      const y = +p.year, mo = +p.month, day = +p.day, h = +p.hour, mi = +p.minute, s = +p.second;
      const wd = new Date(Date.UTC(y, mo - 1, day)).getUTCDay();
      return {
        date: d, y, mo, day, h, mi, s, wd,
        dayKey: `${p.year}-${p.month}-${p.day}`,
        sortKey: `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`
      };
    }
    function fmtDateShort(hp) { return hp ? `${pad(hp.day)} ${MONTHS[S.lang][hp.mo - 1]}` : '—'; }
    function fmtDateFull(hp) { return hp ? `${pad(hp.day)} ${MONTHS[S.lang][hp.mo - 1]} ${hp.y}` : '—'; }
    function fmtWeekday(hp) { return hp ? WEEKDAYS[S.lang][hp.wd] : ''; }
    function fmtTime(hp) {
      if (!hp) return '—';
      const h12 = hp.h % 12 || 12;
      const ampm = S.lang === 'es' ? (hp.h < 12 ? 'a. m.' : 'p. m.') : (hp.h < 12 ? 'AM' : 'PM');
      return `${h12}:${pad(hp.mi)} ${ampm}`;
    }
    function fmtRange(fromIso, toIso) {
      if (!fromIso && !toIso) return null;
      const a = fromIso ? hnParts(fromIso + 'T00:00:00-06:00') : null;
      const b = toIso ? hnParts(toIso + 'T00:00:00-06:00') : null;
      return `${a ? fmtDateFull(a) : '—'} – ${b ? fmtDateFull(b) : '—'}`;
    }

    async function api(url) {
      const r = await fetch(url);
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        const e = new Error(d.detail || 'Error'); e.status = r.status; throw e;
      }
      return r.json();
    }

        tv: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/>',
        radio: '<circle cx="12" cy="15" r="3"/><path d="M4 15a8 8 0 0116 0"/><path d="M2 12l3 1.2M22 12l-3 1.2"/>',
        off: '<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>',

      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[name] || ''}</svg>`;
    }

    /* ── Bulk fetch of the full detection set (client-side aggregation,
         matches REPORT_METRICS comment: "agregado en el front") ────── */
    const DETAIL_METRICS = ['by_medium', 'by_daypart', 'by_source', 'timeline', 'detections_detail', 'by_ad', 'by_campaign'];
    function needsDetail(metrics) { return DETAIL_METRICS.some(m => metrics.includes(m)); }

    async function bulkFetchDetections() {
      const cap = 3000, pageSize = 200;
      const base = {
        stream_id: S.serverFilters.stream, campaign_id: S.serverFilters.campaign,
        date_from: S.serverFilters.from, date_to: S.serverFilters.to
      };
      let page = 1, pages = 1, out = [], total = 0;
      do {
        const params = new URLSearchParams({ page, page_size: pageSize });
        Object.entries(base).forEach(([k, v]) => { if (v) params.set(k, v); });
        const data = await api(`${BASE}/detections?${params}`);
        pages = data.pages; total = data.total;
        out = out.concat(data.results);
        page++;
      } while (page <= pages && out.length < cap);
      S.detsCapped = out.length < total;
      S.allDets = out.map(d => ({ ...d, hn: hnParts(d.air_time_hn) }));
      S.detsLoaded = true;
    }

    /* ── Client-side filtering (pills + search) over the bulk dataset ── */
    function distinctMediaTypes() {
      return Array.from(new Set(S.allDets.map(d => d.stream_type))).sort();
    }
    function filteredDets() {
      let rows = S.allDets;
      if (S.pillFilters.ad) rows = rows.filter(d => String(d.ad_name) === S.pillFilters.ad);
      if (S.pillFilters.media) rows = rows.filter(d => d.stream_type === S.pillFilters.media);
      if (S.query) {
        const q = S.query.toLowerCase();
        rows = rows.filter(d => [d.stream_name, d.ad_name, fmtDateShort(d.hn)].some(v => String(v || '').toLowerCase().includes(q)));
      }
      return rows;
    }
    function mediaColor(type) {
      return {
        radio: 'var(--media-radio)', tv: 'var(--media-tv)', streaming: 'var(--media-streaming)',
        podcast: 'var(--media-podcast)', news: 'var(--media-news)', social: 'var(--media-social)'
      }[type] || 'var(--media-radio)';
    }
    function enc(s) { return encodeURIComponent(s).replace(/'/g, '%27'); }
    function dec(s) { return decodeURIComponent(s); }

    /* ── Render: shell ────────────────────────────────────────── */
    function buildUtilBar() {
      return `<div class="pep-util">
    <span class="pep-util__verified">${icon('shield', 15)}${t().verified}</span>
    <span class="pep-util__spacer"></span>
    <div class="pep-util__controls">
      <button id="pdf-btn" class="pep-btn pep-btn--secondary" onclick="downloadPdf()">${icon('download', 14)}${t().downloadPdf}</button>
      <div class="pep-lang">
        <button class="${S.lang === 'es' ? 'is-on' : ''}" onclick="setLang('es')">ES</button>
        <button class="${S.lang === 'en' ? 'is-on' : ''}" onclick="setLang('en')">EN</button>
      </div>
      <button class="pep-iconbtn" onclick="toggleTheme()" title="Theme">${icon('theme', 15)}</button>
    </div>
  </div>`;
    }

    function buildHeader() {
      const r = S.report, L = S.lang === 'es';
      const initial = esc((r.client_name || '?').charAt(0).toUpperCase());
      const logoInner = r.client_logo
        ? `<img src="${esc(r.client_logo)}" alt="" onerror="this.parentElement.textContent='${initial}'">`
        : initial;

      const metaItems = [];
      if (S.config.metrics.includes('period_covered') && (r.date_from || r.date_to)) {
        metaItems.push([t().period, esc(fmtRange(r.date_from, r.date_to) || '—')]);
      }
      if (r.generated_at) metaItems.push([t().generated, esc(fmtDateFull(hnParts(r.generated_at)))]);
      if (r.ref) metaItems.push([t().evidenceId, `<span style="font-family:var(--font-mono)">${esc(r.ref)}</span>`]);
      if (r.expires_at) metaItems.push([t().expires, esc(fmtDateFull(hnParts(r.expires_at)))]);

      const campaignName = r.title || r.campaign_name || (L ? 'Varias campañas' : 'Multiple campaigns');

      return `<header class="pep-head">
    <div class="pep-head__top">
      <div class="pep-head__logo">${logoInner}</div>
      <div class="pep-head__id">
        <div class="pep-head__eyebrow">${t().kind}</div>
        <div class="pep-head__client">${esc(r.client_name || '—')}</div>
        ${r.provider_name ? `<div class="pep-head__issuer">${t().issuedBy} <strong>${esc(r.provider_name)}</strong></div>` : ''}
      </div>
      <span class="pep-head__verified">${icon('shield', 14)}${t().confirmed}</span>
    </div>
    <div class="pep-head__campaign">
      <span class="pep-head__campaign-label">${t().campaign}</span>
      <span class="pep-head__campaign-name">${esc(campaignName)}${r.ad_name ? ' · ' + esc(r.ad_name) : ''}</span>
      <div class="pep-head__meta">
        ${metaItems.map(([k, v]) => `<div class="pep-head__meta-item"><span class="pep-head__meta-k">${esc(k)}</span><span class="pep-head__meta-v">${v}</span></div>`).join('')}
      </div>
    </div>
  </header>`;
    }

    function buildKPIs() {
      const s = S.summary, m = S.config.metrics;
      const cards = [];
      if (m.includes('total_emissions')) {
        cards.push({ label: t().kpiTotal, val: fmtN(s.total_detections), sub: t().detections });
        cards.push({ label: t().kpiSources, val: fmtN(s.media_sources), sub: t().sources });
      }
      if (m.includes('period_covered')) {
        const f = hnParts(s.first_detection), l = hnParts(s.last_detection);
        cards.push({ label: t().kpiFirst, val: f ? fmtDateShort(f) : '—', sub: f ? fmtTime(f) : '' });
        cards.push({ label: t().kpiLast, val: l ? fmtDateShort(l) : '—', sub: l ? fmtTime(l) : '' });
      }
      if (!cards.length) return '';
      const overFlag = s.over_airing > 0
        ? `<div class="pep-kpi__flag">${icon('calendar', 11)}${fmtN(s.over_airing)} ${t().overAiring}</div>` : '';
      return `<section class="pep-section">
    <div class="pep-section__head"><div class="pep-section__title">${t().summaryTitle}</div></div>
    <div class="pep-kpis">
      ${cards.map((c, i) => `<div class="pep-kpi">
        <div class="pep-kpi__label">${esc(c.label)}</div>
        <div class="pep-kpi__val">${esc(c.val)}</div>
        <div class="pep-kpi__sub">${esc(c.sub)}</div>
        ${i === 0 ? overFlag : ''}
      </div>`).join('')}
    </div>
  </section>`;
    }

    /* ── Render: detail sections (rebuilt on filter/pill/search change) ── */
    function buildByMedium() {
      const rows = filteredDets();
      const counts = {};
      rows.forEach(d => { counts[d.stream_type] = (counts[d.stream_type] || 0) + 1; });
      const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const total = order.reduce((s, k) => s + counts[k], 0) || 1;
      let acc = 0; const stops = [];
      order.forEach(k => { const start = (acc / total) * 100; acc += counts[k]; const end = (acc / total) * 100; stops.push(`${mediaColor(k)} ${start}% ${end}%`); });
      if (!order.length) return '';
      return `<section>
    <div class="pep-section__title" style="margin-bottom:14px;">${t().byMedium}</div>
    <div class="pep-bymedium">
      <div class="pep-bymedium__donut" style="background:conic-gradient(${stops.join(',')})">
        <div class="pep-bymedium__hole"><span>${total}</span><small>${t().detections}</small></div>
      </div>
      <div class="pep-bymedium__legend">
        ${order.map(k => `<div class="pep-bymedium__leg">
          <span class="pep-bymedium__dot" style="background:${mediaColor(k)}"></span>
          <span class="pep-bymedium__name">${esc(MEDIA_LABEL[S.lang][k] || k)}</span>
          <span class="pep-bymedium__val">${counts[k]}</span>
        </div>`).join('')}
      </div>
    </div>
  </section>`;
    }

    function buildDayparts() {
      const L = S.lang === 'es';
      const rows = filteredDets();
      const buckets = [
        { key: 'manana', label: L ? 'Mañana' : 'Morning', sub: '06–12' },
        { key: 'tarde', label: L ? 'Tarde' : 'Afternoon', sub: '12–18' },
        { key: 'prime', label: 'Prime', sub: '18–22' },
        { key: 'noche', label: L ? 'Noche' : 'Night', sub: '22–06' },
      ];
      const count = { manana: 0, tarde: 0, prime: 0, noche: 0 };
      rows.forEach(d => {
        const h = d.hn ? d.hn.h : 0;
        if (h >= 6 && h < 12) count.manana++; else if (h >= 12 && h < 18) count.tarde++;
        else if (h >= 18 && h < 22) count.prime++; else count.noche++;
      });
      const max = Math.max(1, count.manana, count.tarde, count.prime, count.noche);
      return `<section>
    <div class="pep-section__title" style="margin-bottom:14px">${t().dayparts}</div>
    <div class="pep-breakdown">
      ${buckets.map(b => `<div class="pep-breakdown__row">
        <span class="pep-breakdown__name">${esc(b.label)} <span style="color:var(--text-tertiary)">${b.sub}</span></span>
        <span class="pep-breakdown__track"><span class="pep-breakdown__bar" style="width:${(count[b.key] / max * 100)}%"></span></span>
        <span class="pep-breakdown__val">${count[b.key]}</span>
      </div>`).join('')}
    </div>
  </section>`;
    }

    function buildBySource() {
      const rows = filteredDets();
      const map = {}, typeOf = {};
      rows.forEach(d => { map[d.stream_name] = (map[d.stream_name] || 0) + 1; typeOf[d.stream_name] = d.stream_type; });
      const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return '';
      const total = entries.reduce((s, e) => s + e[1], 0) || 1;
      return `<section class="pep-section">
    <div class="pep-section__head">
      <div><div class="pep-section__title">${t().bySource}</div></div>
      <span class="pep-section__count">${entries.length} ${t().sources}</span>
    </div>
    <div class="pep-breakdown">
      ${entries.map(([name, n]) => {
        const pct = Math.round(n / total * 100);
        return `<div class="pep-breakdown__row">
          <span class="pep-breakdown__name">${esc(name)}</span>
          <span class="pep-breakdown__track"><span class="pep-breakdown__bar" style="width:${pct}%;background:${mediaColor(typeOf[name])}"></span></span>
          <span class="pep-breakdown__val">${pct}% · ${n}</span>
        </div>`;
      }).join('')}
    </div>
  </section>`;
    }

    function buildBreakdown(field, title) {
      const rows = filteredDets();
      const map = {};
      rows.forEach(d => { const k = d[field] || '—'; map[k] = (map[k] || 0) + 1; });
      const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return '';
      const max = Math.max.apply(null, entries.map(e => e[1]));
      return `<section class="pep-section">
    <div class="pep-section__head"><div class="pep-section__title">${title}</div></div>
    <div class="pep-breakdown">
      ${entries.map(([name, n]) => `<div class="pep-breakdown__row">
        <span class="pep-breakdown__name">${esc(name)}</span>
        <span class="pep-breakdown__track"><span class="pep-breakdown__bar" style="width:${(n / max * 100)}%"></span></span>
        <span class="pep-breakdown__val">${n}</span>
      </div>`).join('')}
    </div>
  </section>`;
    }

    function buildTimeline() {
      const rows = filteredDets();
      const days = Array.from(new Set(rows.map(d => d.hn && d.hn.dayKey).filter(Boolean))).sort();
      const srcMap = new Map();
      rows.forEach(d => { if (!srcMap.has(d.stream_id)) srcMap.set(d.stream_id, { id: d.stream_id, name: d.stream_name, type: d.stream_type }); });
      const sources = Array.from(srcMap.values()).sort((a, b) => a.type === b.type ? a.name.localeCompare(b.name) : (a.type < b.type ? -1 : 1));
      const byCell = new Map();
      rows.forEach(d => { if (!d.hn) return; const key = d.stream_id + '|' + d.hn.dayKey; if (!byCell.has(key)) byCell.set(key, []); byCell.get(key).push(d); });
      const peak = days.reduce((best, dk) => { const c = rows.filter(d => d.hn && d.hn.dayKey === dk).length; return c > best.c ? { dk, c } : best; }, { dk: null, c: 0 });
      const mediaTypes = Array.from(new Set(sources.map(s => s.type)));
      if (!days.length || !sources.length) {
        return `<section class="pep-section">
      <div class="pep-section__head"><div><div class="pep-section__title">${t().timelineTitle}</div></div></div>
      <div class="pep-empty">${t().noMatch}</div>
    </section>`;
      }
      const cols = `repeat(${days.length}, minmax(22px,1fr))`;
      return `<section class="pep-section">
    <div class="pep-section__head"><div>
      <div class="pep-section__title">${t().timelineTitle}</div>
      <div class="pep-section__sub">${t().timelineSub}</div>
    </div></div>
    <div class="pep-scatter-wrap">
      <div class="pep-scatter__head">
        <div class="pep-scatter__legend">${mediaTypes.map(m => `<span class="pep-scatter__leg"><span class="pep-scatter__legdot" style="background:${mediaColor(m)}"></span>${esc(MEDIA_LABEL[S.lang][m] || m)}</span>`).join('')}</div>
        <div class="pep-scatter__stats">
          <span class="pep-scatter__stat"><span class="pep-scatter__stat-k">${t().detections}</span><span class="pep-scatter__stat-v">${rows.length}</span></span>
          ${peak.dk ? `<span class="pep-scatter__stat"><span class="pep-scatter__stat-k">${t().peak}</span><span class="pep-scatter__stat-v">${esc(fmtDateShort(hnParts(peak.dk + 'T00:00:00-06:00')))} · ${peak.c}</span></span>` : ''}
          <span class="pep-scatter__stat"><span class="pep-scatter__stat-k">${t().sources}</span><span class="pep-scatter__stat-v">${sources.length}</span></span>
        </div>
      </div>
      <div class="pep-scatter__scroll">
        <div class="pep-scatter__row pep-scatter__row--header">
          <div class="pep-scatter__src-col"></div>
          <div class="pep-scatter__track pep-scatter__track--header" style="grid-template-columns:${cols}">
            ${days.map(dk => `<div class="pep-scatter__cell"><span class="pep-scatter__day-lbl">${pad(+dk.split('-')[2])}</span></div>`).join('')}
          </div>
        </div>
        ${sources.map(src => {
        const has = rows.some(d => d.stream_id === src.id);
        return `<div class="pep-scatter__row${!has ? ' pep-scatter__row--dim' : ''}">
            <div class="pep-scatter__src-col">
              <span class="pep-scatter__src-dot" style="background:${mediaColor(src.type)}"></span>
              <span class="pep-scatter__src-name">${esc(src.name)}</span>
            </div>
            <div class="pep-scatter__track" style="grid-template-columns:${cols}">
              <span class="pep-scatter__line"></span>
              ${days.map(dk => {
          const hits = byCell.get(src.id + '|' + dk) || [];
          if (!hits.length) return `<div class="pep-scatter__cell"></div>`;
          const title = hits.map(h => `${fmtDateShort(h.hn)} ${fmtTime(h.hn)}`).join('\n');
          return `<div class="pep-scatter__cell"><div class="pep-scatter__dot" style="background:${mediaColor(src.type)}" title="${esc(title)}">${hits.length > 1 ? `<span class="pep-scatter__badge">${hits.length}</span>` : ''}</div></div>`;
        }).join('')}
            </div>
          </div>`;
      }).join('')}
      </div>
    </div>
  </section>`;
    }

    /* ── Filters UI ───────────────────────────────────────────── */
    function buildRefine() {
      const f = S.filtersMeta || {};
      const streamOpts = (f.streams || []).map(s => `<option value="${esc(s.id)}" ${S.serverFilters.stream === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
      const campOpts = (f.campaigns || []).map(c => `<option value="${esc(c.id)}" ${S.serverFilters.campaign === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
      return `<div class="pep-refine"><div class="pep-refine__row">

      <select class="pep-fc" onchange="setServerFilter('stream', this.value)"><option value="">${t().allStreams}</option>${streamOpts}</select>

    </div>` : ''}
    <div class="pep-fg"><label>${t().from}</label><input type="date" class="pep-fc" value="${esc(S.serverFilters.from)}" onchange="setServerFilter('from', this.value)"></div>
    <div class="pep-fg"><label>${t().to}</label><input type="date" class="pep-fc" value="${esc(S.serverFilters.to)}" onchange="setServerFilter('to', this.value)"></div>

    function buildPills() {
      const rows = S.allDets;
      const ads = Array.from(new Set(rows.map(d => d.ad_name))).filter(Boolean);
      const medias = distinctMediaTypes();
      const allOn = !S.pillFilters.ad && !S.pillFilters.media;
      if (ads.length <= 1 && medias.length <= 1) return '';
      return `<div class="pep-filters">
    <span class="pep-filters__label">${t().filter}</span>
    <button class="pep-filters__pill${allOn ? ' is-on' : ''}" onclick="clearPills()">${t().all}</button>
    ${ads.length > 1 ? `<div class="pep-filters__sep"></div>${ads.map(a => `<button class="pep-filters__pill${S.pillFilters.ad === a ? ' is-on' : ''}" onclick="setPill('ad','${enc(a)}')">${esc(a)}</button>`).join('')}` : ''}
    ${medias.length > 1 ? `<div class="pep-filters__sep"></div>${medias.map(m => `<button class="pep-filters__pill${S.pillFilters.media === m ? ' is-on' : ''}" onclick="setPill('media','${enc(m)}')">${esc(MEDIA_LABEL[S.lang][m] || m)}</button>`).join('')}` : ''}
  </div>`;

    /* ── Evidence library (grouped by source) ────────────────────── */
    const PAGE = 10, COLLAPSE_OVER = 40;
    function groupIsCollapsed(id, itemCount, manyTotal) {
      return (id in S.collapsed) ? S.collapsed[id] : (manyTotal || itemCount > COLLAPSE_OVER);
    }
    function buildLibrary() {
      const dets = filteredDets();
      const groupsMap = new Map();
      dets.forEach(d => {
        if (!groupsMap.has(d.stream_id)) groupsMap.set(d.stream_id, { id: d.stream_id, name: d.stream_name, type: d.stream_type, city: d.stream_city, items: [] });
        groupsMap.get(d.stream_id).items.push(d);
      });
      const groups = Array.from(groupsMap.values());
      groups.forEach(g => g.items.sort((a, b) => (a.hn && b.hn) ? a.hn.sortKey.localeCompare(b.hn.sortKey) : 0));
      groups.sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name));
      const manyTotal = dets.length > 30;
      const allExpanded = groups.length > 0 && groups.every(g => !groupIsCollapsed(g.id, g.items.length, manyTotal));

      const header = `<div class="pep-section__head">
    <div><div class="pep-section__title">${t().libraryTitle}</div><div class="pep-section__sub">${t().librarySub}</div></div>
    <div class="pep-lib-tools">
      <span class="pep-section__count">${dets.length} ${t().detections} · ${groups.length} ${t().sources}</span>
      ${(!S.printMode && groups.length > 1) ? `<button class="pep-lib-toggle" onclick="toggleAllGroups(${allExpanded})">${icon('chevs', 14)}${allExpanded ? t().collapseAll : t().expandAll}</button>` : ''}
    </div>
  </div>`;

      const search = S.printMode ? '' : `<div class="pep-rsearch">${icon('search', 15)}
    <input id="lib-search" value="${esc(S.query)}" placeholder="${esc(t().searchPh)}" oninput="onSearch(this.value)">
    ${S.query ? `<button onclick="onSearch('')">${icon('x', 14)}</button>` : ''}
  </div>`;

      if (!groups.length) {
        return `<section class="pep-section">${header}${search}<div class="pep-empty">${t().noMatch}</div></section>`;
      }

      const body = groups.map(g => {
        const coll = S.printMode ? false : groupIsCollapsed(g.id, g.items.length, manyTotal);
        const shownN = S.printMode ? g.items.length : (S.shown[g.id] || PAGE);
        const visible = coll ? [] : g.items.slice(0, shownN);
        const more = coll ? 0 : g.items.length - visible.length;
        return `<div class="pep-group${coll ? ' is-collapsed' : ''}">
      <button class="pep-group__head" onclick="toggleGroup('${g.id}')">
        <span class="pep-group__ico">${icon(g.type === 'tv' ? 'tv' : 'radio', 14)}</span>
        <span class="pep-group__name">${esc(g.name)}</span>
        ${g.city ? `<span class="pep-group__city">· ${esc(g.city)}</span>` : ''}
        <span class="pep-group__count">${g.items.length} ${t().airings}</span>
        <span class="pep-group__chev">${icon('chevdown', 15)}</span>
      </button>
      ${!coll ? `
        ${visible.map(d => `<a class="pep-grow" href="?evidence=${esc(d.evd)}" onclick="event.preventDefault();openViewer('${esc(d.evd)}')" aria-label="${esc(t().viewEvidence)}: ${esc(d.ad_name)}">
          <span class="pep-list__ad">
            <span class="pep-list__ad-name">${esc(d.ad_name)}</span>
            <span class="pep-list__ad-id">${esc(d.evd)}</span>
          </span>
          <span class="pep-list__cell">${esc(fmtDateShort(d.hn))}</span>
          <span class="pep-list__cell pep-list__cell--mono">${esc(fmtTime(d.hn))}</span>
          <span>${d.over_airing ? `<span class="pep-list__flag">${t().overAiring}</span>` : ''}</span>
          <span class="pep-list__go">${icon('play', 17)}</span>
        </a>`).join('')}
        ${more > 0 ? `<button class="pep-gmore" onclick="showMore('${g.id}')">${t().showMore} ${Math.min(PAGE, more)} · ${more} ${t().remaining}</button>` : ''}
        <div class="pep-gsubtotal"><span>${t().subtotal}</span><strong>${g.items.length} ${t().airings}</strong></div>
      ` : ''}
    </div>`;
      }).join('');

      return `<section class="pep-section">${header}${search}<div class="pep-glist">${body}</div></section>`;
    }

    /* ── Evidence Viewer (audio waveform / video stage) ──────────── */
    async function openViewer(evd) {
      let d = S.allDets.find(x => x.evd === evd);
      if (!d) {
        try { const raw = await api(`${BASE}/evidence/${evd}`); d = { ...raw, hn: hnParts(raw.air_time_hn) }; }
        catch (e) { return; }
      }
      S.open = d;
      renderViewer();
      history.replaceState(null, '', location.pathname + '?evidence=' + evd);
    }
    function closeViewer() {
      S.open = null;
      const el = document.getElementById('viewer-root');
      if (el) el.innerHTML = '';
      history.replaceState(null, '', location.pathname);
    }
    function renderViewer() {
      const root = document.getElementById('viewer-root');
      if (!root) return;
      const d = S.open;
      if (!d) { root.innerHTML = ''; return; }
      const L = S.lang === 'es';
      const isVideo = d.clip_type === 'video';
      root.innerHTML = `<div class="pep-viewer-scrim" onclick="closeViewer()">
    <div class="pep-viewer" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-label="${esc(t().viewer)}">
      <div class="pep-viewer__head">
        <span class="pep-viewer__head-ico">${icon(isVideo ? 'monitor' : 'volume', 18)}</span>
        <div class="pep-viewer__head-t">
          <div class="pep-viewer__head-kind">${t().viewer}</div>
          <div class="pep-viewer__head-ad">${esc(d.ad_name)}</div>
        </div>
        <button class="pep-iconbtn" onclick="closeViewer()" aria-label="${esc(t().close)}">${icon('x', 16)}</button>
      </div>
      <div class="pep-viewer__body">
        ${!d.clip_url ? `<div class="pep-empty">${L ? 'Evidencia no disponible' : 'Evidence not available'}</div>`
          : isVideo
            ? `<div class="pep-stage pep-stage--video"><video controls preload="metadata" src="${esc(d.clip_url)}"></video></div>`
            : `<div class="pep-stage pep-stage--audio">
                <canvas class="pep-wave" id="wave-cv"></canvas>
                <audio id="viewer-audio" preload="metadata" src="${esc(d.clip_url)}"></audio>
                <div class="pep-transport">
                  <button class="pep-transport__play" id="wave-play" onclick="toggleAudio()" aria-label="Play">${icon('play', 17)}</button>
                  <span class="pep-transport__time" id="wave-time">0:00 / 0:00</span>
                  <span class="pep-transport__type">${icon('volume', 13)}${t().audioEvidence}</span>
                </div>
              </div>`}
        <div class="pep-vmeta">
          <div class="pep-vmeta__cell"><span class="pep-vmeta__k">${t().source}</span><span class="pep-vmeta__v">${esc(d.stream_name)}</span></div>
          <div class="pep-vmeta__cell"><span class="pep-vmeta__k">${t().status}</span><span class="pep-vmeta__v" style="color:var(--success-fg);font-weight:600">${esc(CONF_LABEL[S.lang][d.confidence_level] || t().confirmed)}</span></div>
          <div class="pep-vmeta__cell"><span class="pep-vmeta__k">${t().recordedAt}</span><span class="pep-vmeta__v">${esc(fmtDateShort(d.hn))} · ${esc(fmtTime(d.hn))}</span></div>
          <div class="pep-vmeta__cell"><span class="pep-vmeta__k">${t().evidenceId}</span><span class="pep-vmeta__v" style="font-family:var(--font-mono)">${esc(d.evd)}</span></div>
        </div>
      </div>
      <div class="pep-viewer__foot">
        <span class="pep-badge">${icon('check', 12)}${t().confirmed}</span>
      </div>
    </div>
  </div>`;
      if (!isVideo && d.clip_url) setupAudioViewer(d.clip_url);
    }
    function setupAudioViewer(url) {
      const audio = document.getElementById('viewer-audio');
      const canvas = document.getElementById('wave-cv');
      const playBtn = document.getElementById('wave-play');
      const timeEl = document.getElementById('wave-time');
      if (!audio || !canvas) return;
      let peaks = null, progress = 0;

      function fmtS(s) { if (!isFinite(s)) return '0:00'; const m = Math.floor(s / 60), x = Math.floor(s % 60); return `${m}:${pad(x)}`; }
      function draw() {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        canvas.width = w * dpr; canvas.height = h * dpr;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1CC0F9';
        const muted = getComputedStyle(document.documentElement).getPropertyValue('--border-strong').trim() || getComputedStyle(document.documentElement).getPropertyValue('--border-default').trim() || '#888';
        if (!peaks) { ctx.fillStyle = muted; ctx.fillRect(0, h / 2 - 1, w, 2); return; }
        const n = peaks.length, gap = 2, bw = Math.max(1.5, (w - gap * (n - 1)) / n), mid = h / 2;
        for (let i = 0; i < n; i++) {
          const ph = Math.max(3, peaks[i] * (h - 6));
          const x = i * (bw + gap);
          ctx.fillStyle = (i / n) <= progress ? accent : muted;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, mid - ph / 2, bw, ph, Math.min(bw / 2, 1.5)); else ctx.rect(x, mid - ph / 2, bw, ph);
          ctx.fill();
        }
      }
      draw();
      window.addEventListener('resize', draw);

      function seekEvt(e) {
        if (!audio.duration) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        audio.currentTime = frac * audio.duration;
      }
      canvas.addEventListener('click', seekEvt);
      canvas.addEventListener('touchstart', seekEvt, { passive: true });

      audio.addEventListener('timeupdate', () => {
        progress = audio.duration ? audio.currentTime / audio.duration : 0;
        timeEl.textContent = `${fmtS(audio.currentTime)} / ${fmtS(audio.duration || 0)}`;
        draw();
      });
      audio.addEventListener('ended', () => { playBtn.innerHTML = icon('play', 17); });
      window._toggleAudio = () => {
        if (audio.paused) { audio.play().catch(() => { }); playBtn.innerHTML = icon('pause', 17); }
        else { audio.pause(); playBtn.innerHTML = icon('play', 17); }
      };

      /* Best-effort REAL waveform via Web Audio decode of the actual clip.
         Falls back to a flat baseline (playback still fully works) if the S3
         bucket doesn't send CORS headers permitting cross-origin reads. */
      fetch(url).then(r => r.arrayBuffer())
        .then(buf => new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(buf))
        .then(audioBuf => {
          const ch = audioBuf.getChannelData(0);
          const bars = 120, step = Math.floor(ch.length / bars) || 1;
          const out = new Array(bars);
          for (let b = 0; b < bars; b++) { let max = 0; for (let i = 0; i < step; i++) { const v = Math.abs(ch[b * step + i] || 0); if (v > max) max = v; } out[b] = max; }
          const mx = Math.max.apply(null, out) || 1;
          peaks = out.map(v => Math.max(0.06, v / mx));
          draw();
        })
        .catch(() => { });
    }
    function toggleAudio() { if (window._toggleAudio) window._toggleAudio(); }

    /* ── Footer / expired state ──────────────────────────────────── */
    function buildFooter() {
      const url = location.origin + location.pathname;
      return `<footer class="pep-foot"><div class="pep-foot__inner">
    <div class="pep-foot__share">
      <img class="pep-foot__qr" src="${BASE}/qr.png" alt="QR" loading="lazy">
