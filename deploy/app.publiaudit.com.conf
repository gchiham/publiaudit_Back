server {
    listen 80;
    server_name app.publiaudit.com;

    root /opt/media-app/web;
    index index.html;

    # Long-cache hashed build assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every other path falls back to index.html (client-side router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
